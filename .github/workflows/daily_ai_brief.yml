name: Daily AI Briefing Scraper

on:
  schedule:
    # This runs at 08:00 UTC every day (approx. 3:00 AM or 4:00 AM EST)
    - cron: '0 8 * * *'
  workflow_dispatch: # This adds a "Run Now" button so you can test it!

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update Daily AI Briefing: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
