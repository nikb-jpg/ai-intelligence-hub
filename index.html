<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Intelligence Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; border: 1px solid #334155; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: #38bdf8; }
    </style>
</head>
<body class="p-4 md:p-8">
    <header class="max-w-6xl mx-auto mb-12 border-b border-slate-700 pb-6">
        <h1 class="text-4xl font-bold text-sky-400">AI Intelligence Hub</h1>
        <p class="text-slate-400 mt-2">Hybrid Human Strategy Dashboard • Daily Briefing</p>
    </header>

    <main id="dashboard" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="text-center col-span-3">Loading latest intelligence...</div>
    </main>

    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('archive.json');
                const data = await response.json();
                
                // Get the most recent date
                const dates = Object.keys(data).sort().reverse();
                const latestDate = dates[0];
                const latestData = data[latestDate];

                const container = document.getElementById('dashboard');
                container.innerHTML = ''; // Clear loading message

                for (const [section, items] of Object.entries(latestData)) {
                    let sectionHtml = `
                        <div class="space-y-6">
                            <h2 class="text-xl font-semibold text-sky-300 uppercase tracking-widest border-l-4 border-sky-500 pl-3">${section}</h2>
                            <div class="space-y-4">
                    `;

                    items.forEach(item => {
                        sectionHtml += `
                            <div class="card p-5 rounded-xl shadow-lg">
                                <a href="${item.link}" target="_blank" class="text-lg font-bold hover:text-sky-400 leading-tight block mb-2">${item.title}</a>
                                <p class="text-sm text-slate-400 line-clamp-3">${item.summary}</p>
                            </div>
                        `;
                    });

                    sectionHtml += `</div></div>`;
                    container.innerHTML += sectionHtml;
                }
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('dashboard').innerHTML = '<p class="col-span-3 text-red-400">Error loading intelligence feed. Please ensure the scraper has run successfully.</p>';
            }
        }
        loadDashboard();
    </script>
</body>
</html>
